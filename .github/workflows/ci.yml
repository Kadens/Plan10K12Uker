name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - data/**
      - Plan10K12Uker.slnx
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      # Docker is available on ubuntu-latest, so the Testcontainers PostgreSQL tests run here.
      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
